<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="600" height="400" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Background -->
    <rect width="600" height="400" fill="#F8F8F8" />
    <rect x="20" y="20" width="560" height="360" rx="12" fill="#FFFFFF" stroke="#EBEBEB" stroke-width="1.5" />

    <!-- Streamlit Header Bar -->
    <rect x="20" y="20" width="560" height="48" fill="#FFFFFF" />
    <line x1="20" y1="68" x2="580" y2="68" stroke="#EBEBEB" stroke-width="1" />
    <!-- Streamlit Logo Dot & App Title -->
    <circle cx="48" cy="44" r="6" fill="#FF6250" />
    <circle cx="64" cy="44" r="4" fill="#FFD66B" />
    <circle cx="76" cy="44" r="4" fill="#009379" />
    <text x="96" y="48" font-family="'Epilogue', sans-serif" font-size="13" font-weight="700" fill="#2D2D2D">OCR Scanner App · Streamlit</text>
    
    <!-- Status Badge -->
    <rect x="470" y="34" width="85" height="22" rx="4" fill="#F1F1F1" />
    <text x="480" y="49" font-family="'Epilogue', sans-serif" font-size="10" font-weight="600" fill="#2D2D2D">Tesseract v5</text>

    <!-- App Body: Left side Document with OCR Bounding Boxes -->
    <g transform="translate(50, 95)">
      <!-- Document Sheet -->
      <rect x="0" y="0" width="220" height="255" rx="6" fill="#FAFAFA" stroke="#E2E2E2" stroke-width="1.5" />
      <line x1="20" y1="30" x2="160" y2="30" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round" />
      <line x1="20" y1="46" x2="200" y2="46" stroke="#D1D1D1" stroke-width="2" stroke-linecap="round" />
      <line x1="20" y1="58" x2="185" y2="58" stroke="#D1D1D1" stroke-width="2" stroke-linecap="round" />
      <line x1="20" y1="70" x2="195" y2="70" stroke="#D1D1D1" stroke-width="2" stroke-linecap="round" />

      <!-- OCR Scanning Beam & Detection Boxes -->
      <rect x="16" y="95" width="188" height="50" rx="4" fill="#009379" fill-opacity="0.08" stroke="#009379" stroke-width="1.5" stroke-dasharray="3 3" />
      <rect x="24" y="104" width="70" height="14" rx="2" fill="#009379" fill-opacity="0.2" />
      <rect x="100" y="104" width="85" height="14" rx="2" fill="#009379" fill-opacity="0.2" />
      <rect x="24" y="124" width="110" height="14" rx="2" fill="#009379" fill-opacity="0.2" />

      <!-- Laser scan line -->
      <line x1="12" y1="120" x2="208" y2="120" stroke="#FF6250" stroke-width="2" />
      <circle cx="208" cy="120" r="3" fill="#FF6250" />

      <!-- Paragraph lines -->
      <line x1="20" y1="168" x2="190" y2="168" stroke="#D1D1D1" stroke-width="2" stroke-linecap="round" />
      <line x1="20" y1="180" x2="170" y2="180" stroke="#D1D1D1" stroke-width="2" stroke-linecap="round" />
      <line x1="20" y1="192" x2="140" y2="192" stroke="#D1D1D1" stroke-width="2" stroke-linecap="round" />
      
      <rect x="20" y="215" width="115" height="22" rx="4" fill="#009379" />
      <text x="32" y="230" font-family="'Epilogue', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Preprocessed (CV2)</text>
    </g>

    <!-- App Body: Right side Extracted Editable Text & Actions -->
    <g transform="translate(305, 95)">
      <rect x="0" y="0" width="245" height="255" rx="6" fill="#F8F8F8" stroke="#E2E2E2" stroke-width="1" />
      <text x="18" y="28" font-family="'Epilogue', sans-serif" font-size="12" font-weight="700" fill="#2D2D2D">Extracted Text Output</text>
      
      <!-- Text content mock -->
      <rect x="18" y="44" width="209" height="140" rx="4" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="1" />
      <text x="28" y="66" font-family="monospace" font-size="10" fill="#2D2D2D">&gt; Model: Tesseract OCR</text>
      <text x="28" y="84" font-family="monospace" font-size="10" fill="#009379">&gt; Confidence: 98.4%</text>
      <text x="28" y="104" font-family="monospace" font-size="9.5" fill="#555555">Text extracted successfully.</text>
      <text x="28" y="122" font-family="monospace" font-size="9.5" fill="#555555">Cleaned &amp; thresholded</text>
      <text x="28" y="140" font-family="monospace" font-size="9.5" fill="#555555">Ready for export (.txt, .pdf)</text>
      <rect x="150" y="132" width="6" height="12" fill="#FF6250" />

      <!-- Streamlit Action Buttons -->
      <rect x="18" y="200" width="100" height="34" rx="4" fill="#2D2D2D" />
      <text x="32" y="222" font-family="'Epilogue', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Download</text>

      <rect x="126" y="200" width="101" height="34" rx="4" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="1.2" />
      <text x="145" y="222" font-family="'Epilogue', sans-serif" font-size="11" font-weight="600" fill="#2D2D2D">Copy Text</text>
    </g>

    <!-- Corner Decorative Element -->
    <path d="M 570,380 L 580,380 L 580,370 Z" fill="#009379" />
  </g>
</svg>
