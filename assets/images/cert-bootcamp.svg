<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgElevate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FBFBFB" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD66B" />
      <stop offset="100%" stop-color="#E5B942" />
    </linearGradient>
    <clipPath id="certClip">
      <rect width="800" height="550" rx="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#certClip)">
    <!-- Certificate Background -->
    <rect width="800" height="550" fill="url(#bgElevate)" stroke="#E5E5E5" stroke-width="2" />
    
    <!-- Outer Elegant Border -->
    <rect x="25" y="25" width="750" height="500" fill="none" stroke="#2D2D2D" stroke-width="2" stroke-opacity="0.85" rx="4" />
    <rect x="33" y="33" width="734" height="484" fill="none" stroke="#FF6250" stroke-width="1" stroke-opacity="0.6" rx="2" />

    <!-- Corner Decorative Accents -->
    <polygon points="25,25 65,25 25,65" fill="#2D2D2D" />
    <polygon points="775,25 735,25 775,65" fill="#2D2D2D" />
    <polygon points="25,525 65,525 25,485" fill="#2D2D2D" />
    <polygon points="775,525 735,525 775,485" fill="#2D2D2D" />

    <!-- Elevate Logo & Branding -->
    <g transform="translate(320, 65)">
      <!-- Geometric Badge -->
      <polygon points="80,10 95,45 65,45" fill="#FF6250" />
      <polygon points="80,25 105,65 55,65" fill="#2D2D2D" />
      <text x="80" y="92" font-family="'Epilogue', sans-serif" font-size="24" font-weight="800" fill="#2D2D2D" text-anchor="middle" letter-spacing="3">ELEVATE</text>
      <text x="80" y="108" font-family="'Epilogue', sans-serif" font-size="10" font-weight="600" fill="#7E7E7E" text-anchor="middle" letter-spacing="4">TECH ACADEMY</text>
    </g>

    <!-- Certificate Header -->
    <text x="400" y="220" font-family="'Epilogue', sans-serif" font-size="34" font-weight="800" fill="#2D2D2D" text-anchor="middle" letter-spacing="1">Certificate of Completion</text>
    <line x1="320" y1="235" x2="480" y2="235" stroke="#FF6250" stroke-width="2" stroke-linecap="round" />

    <text x="400" y="265" font-family="'Epilogue', sans-serif" font-size="13" font-weight="600" fill="#666666" text-anchor="middle" letter-spacing="2" text-transform="uppercase">This is proudly presented to</text>

    <!-- Recipient Name -->
    <text x="400" y="315" font-family="'Epilogue', sans-serif" font-size="30" font-weight="800" fill="#2D2D2D" text-anchor="middle">Rewan Khaled Yussuf</text>
    <line x1="240" y1="330" x2="560" y2="330" stroke="#CCCCCC" stroke-width="1.5" />

    <!-- Reason / Content -->
    <text x="400" y="365" font-family="'Epilogue', sans-serif" font-size="15" font-weight="500" fill="#444444" text-anchor="middle">For successfully completing the comprehensive program in</text>
    <text x="400" y="395" font-family="'Epilogue', sans-serif" font-size="20" font-weight="700" fill="#009379" text-anchor="middle">Problem Solving &amp; Algorithmic Thinking Bootcamp</text>

    <!-- Seal and Details in Footer -->
    <!-- Gold Ribbon Seal -->
    <g transform="translate(400, 460)">
      <circle cx="0" cy="0" r="32" fill="url(#goldRibbon)" stroke="#D4A72C" stroke-width="2" />
      <circle cx="0" cy="0" r="26" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 2" />
      <path d="M -12,25 L -18,48 L 0,40 L 18,48 L 12,25 Z" fill="#D4A72C" />
      <!-- Star in center -->
      <polygon points="0,-12 3.5,-3.5 12,-3.5 5,2 7.5,10.5 0,5.5 -7.5,10.5 -5,2 -12,-3.5 -3.5,-3.5" fill="#FFFFFF" />
    </g>

    <!-- Signatures -->
    <g transform="translate(150, 450)">
      <line x1="0" y1="20" x2="160" y2="20" stroke="#2D2D2D" stroke-width="1.5" />
      <path d="M 20,10 Q 50,-5 80,12 T 130,5" fill="none" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round" />
      <text x="80" y="38" font-family="'Epilogue', sans-serif" font-size="11" font-weight="700" fill="#2D2D2D" text-anchor="middle">Program Director</text>
      <text x="80" y="52" font-family="'Epilogue', sans-serif" font-size="9.5" fill="#7E7E7E" text-anchor="middle">Elevate Bootcamp</text>
    </g>

    <g transform="translate(490, 450)">
      <line x1="0" y1="20" x2="160" y2="20" stroke="#2D2D2D" stroke-width="1.5" />
      <path d="M 20,12 Q 60,0 90,15 T 140,8" fill="none" stroke="#009379" stroke-width="2" stroke-linecap="round" />
      <text x="80" y="38" font-family="'Epilogue', sans-serif" font-size="11" font-weight="700" fill="#2D2D2D" text-anchor="middle">Lead Instructor</text>
      <text x="80" y="52" font-family="'Epilogue', sans-serif" font-size="9.5" fill="#7E7E7E" text-anchor="middle">Algorithms &amp; DS</text>
    </g>
  </g>
</svg>
