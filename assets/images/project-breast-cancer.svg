<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <clipPath id="cardClip2">
      <rect x="0" y="0" width="600" height="400" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip2)">
    <!-- Base Background -->
    <rect width="600" height="400" fill="#F8F8F8" />
    <rect x="20" y="20" width="560" height="360" rx="12" fill="#FFFFFF" stroke="#EBEBEB" stroke-width="1.5" />

    <!-- Top Bar with Accuracy Badge -->
    <rect x="20" y="20" width="560" height="52" fill="#FFFFFF" />
    <line x1="20" y1="72" x2="580" y2="72" stroke="#EBEBEB" stroke-width="1" />
    <text x="44" y="52" font-family="'Epilogue', sans-serif" font-size="13" font-weight="700" fill="#2D2D2D">Support Vector Machine (SVM) Classifier</text>
    
    <!-- 99.6% Highlight Badge -->
    <rect x="440" y="34" width="115" height="26" rx="13" fill="#FF6250" />
    <text x="456" y="51" font-family="'Epilogue', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">99.6% Accuracy</text>

    <!-- Left: SVM Hyperplane 2D Decision Boundary -->
    <g transform="translate(45, 95)">
      <rect x="0" y="0" width="260" height="255" rx="8" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1" />
      <text x="16" y="26" font-family="'Epilogue', sans-serif" font-size="11" font-weight="700" fill="#2D2D2D">Decision Boundary &amp; Margins</text>

      <!-- Axes -->
      <line x1="30" y1="210" x2="235" y2="210" stroke="#CCCCCC" stroke-width="1.5" />
      <line x1="30" y1="45" x2="30" y2="210" stroke="#CCCCCC" stroke-width="1.5" />
      
      <!-- SVM Hyperplane (Separating line) -->
      <line x1="45" y1="195" x2="225" y2="65" stroke="#2D2D2D" stroke-width="2.5" />
      <!-- Margins (Dotted) -->
      <line x1="35" y1="170" x2="205" y2="45" stroke="#009379" stroke-width="1.5" stroke-dasharray="4 4" />
      <line x1="55" y1="220" x2="235" y2="90" stroke="#FF6250" stroke-width="1.5" stroke-dasharray="4 4" />

      <!-- Class A points (Benign - Teal dots) -->
      <circle cx="65" cy="120" r="5" fill="#009379" />
      <circle cx="85" cy="100" r="5" fill="#009379" />
      <circle cx="110" cy="80" r="5" fill="#009379" />
      <circle cx="125" cy="65" r="5" fill="#009379" />
      <circle cx="70" cy="80" r="5" fill="#009379" />
      <circle cx="150" cy="55" r="5" fill="#009379" />
      <!-- Support vector with circle around -->
      <circle cx="115" cy="115" r="8" fill="none" stroke="#009379" stroke-width="1.5" />
      <circle cx="115" cy="115" r="4" fill="#009379" />

      <!-- Class B points (Malignant - Coral dots) -->
      <circle cx="140" cy="195" r="5" fill="#FF6250" />
      <circle cx="160" cy="175" r="5" fill="#FF6250" />
      <circle cx="180" cy="160" r="5" fill="#FF6250" />
      <circle cx="205" cy="140" r="5" fill="#FF6250" />
      <circle cx="185" cy="185" r="5" fill="#FF6250" />
      <!-- Support vector with circle around -->
      <circle cx="155" cy="145" r="8" fill="none" stroke="#FF6250" stroke-width="1.5" />
      <circle cx="155" cy="145" r="4" fill="#FF6250" />

      <!-- Axis Labels -->
      <text x="180" y="226" font-family="'Epilogue', sans-serif" font-size="9" fill="#888888">Scaled Radius</text>
      <text x="15" y="40" font-family="'Epilogue', sans-serif" font-size="9" fill="#888888">Texture</text>
    </g>

    <!-- Right: Confusion Matrix & Hyperparameter Grid -->
    <g transform="translate(325, 95)">
      <!-- Confusion Matrix block -->
      <rect x="0" y="0" width="225" height="135" rx="8" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1" />
      <text x="16" y="24" font-family="'Epilogue', sans-serif" font-size="11" font-weight="700" fill="#2D2D2D">Confusion Matrix</text>
      
      <!-- 2x2 Matrix Cells -->
      <rect x="35" y="38" width="70" height="40" rx="4" fill="#009379" fill-opacity="0.15" stroke="#009379" stroke-width="1" />
      <text x="56" y="62" font-family="'Epilogue', sans-serif" font-size="13" font-weight="700" fill="#009379">TP: 71</text>

      <rect x="115" y="38" width="70" height="40" rx="4" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1" />
      <text x="140" y="62" font-family="'Epilogue', sans-serif" font-size="13" font-weight="600" fill="#888888">FP: 0</text>

      <rect x="35" y="84" width="70" height="40" rx="4" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1" />
      <text x="60" y="108" font-family="'Epilogue', sans-serif" font-size="13" font-weight="600" fill="#888888">FN: 1</text>

      <rect x="115" y="84" width="70" height="40" rx="4" fill="#009379" fill-opacity="0.15" stroke="#009379" stroke-width="1" />
      <text x="134" y="108" font-family="'Epilogue', sans-serif" font-size="13" font-weight="700" fill="#009379">TN: 142</text>

      <!-- GridSearchCV card -->
      <rect x="0" y="145" width="225" height="105" rx="8" fill="#2D2D2D" />
      <text x="16" y="170" font-family="'Epilogue', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">GridSearchCV Tuning</text>
      
      <text x="16" y="192" font-family="monospace" font-size="9.5" fill="#FFB5B0">Kernel: 'rbf' | C: 10</text>
      <text x="16" y="210" font-family="monospace" font-size="9.5" fill="#FFD66B">Gamma: 'scale'</text>
      <text x="16" y="228" font-family="monospace" font-size="9.5" fill="#FFFFFF">Precision: 0.99 | Recall: 1.00</text>
    </g>

    <polygon points="565,365 575,365 575,375" fill="#FF6250" />
  </g>
</svg>
