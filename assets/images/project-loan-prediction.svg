<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <clipPath id="cardClip4">
      <rect x="0" y="0" width="600" height="400" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip4)">
    <!-- Base Background -->
    <rect width="600" height="400" fill="#F8F8F8" />
    <rect x="20" y="20" width="560" height="360" rx="12" fill="#FFFFFF" stroke="#EBEBEB" stroke-width="1.5" />

    <!-- Top Bar -->
    <rect x="20" y="20" width="560" height="52" fill="#FFFFFF" />
    <line x1="20" y1="72" x2="580" y2="72" stroke="#EBEBEB" stroke-width="1" />
    <text x="44" y="52" font-family="'Epilogue', sans-serif" font-size="13" font-weight="700" fill="#2D2D2D">Loan Prediction ML Pipeline &amp; Evaluation</text>
    
    <rect x="425" y="34" width="130" height="26" rx="13" fill="#2D2D2D" />
    <text x="440" y="51" font-family="'Epilogue', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Model Comparison</text>

    <!-- Pipeline Flow Diagram (Top part of body) -->
    <g transform="translate(45, 92)">
      <!-- Stage 1: Data Preprocessing -->
      <rect x="0" y="0" width="115" height="55" rx="6" fill="#F1F1F1" stroke="#E0E0E0" stroke-width="1" />
      <text x="12" y="24" font-family="'Epilogue', sans-serif" font-size="10.5" font-weight="700" fill="#2D2D2D">1. Preprocess</text>
      <text x="12" y="42" font-family="'Epilogue', sans-serif" font-size="9" fill="#666666">Scaling &amp; Encoding</text>

      <!-- Arrow 1 -->
      <line x1="120" y1="28" x2="135" y2="28" stroke="#2D2D2D" stroke-width="1.5" />
      <polygon points="135,28 130,24 130,32" fill="#2D2D2D" />

      <!-- Stage 2: Feature Engineering -->
      <rect x="140" y="0" width="115" height="55" rx="6" fill="#F1F1F1" stroke="#E0E0E0" stroke-width="1" />
      <text x="12" y="24" font-family="'Epilogue', sans-serif" font-size="10.5" font-weight="700" fill="#2D2D2D">2. Features</text>
      <text x="12" y="42" font-family="'Epilogue', sans-serif" font-size="9" fill="#666666">Applicant &amp; Income</text>

      <!-- Arrow 2 -->
      <line x1="260" y1="28" x2="275" y2="28" stroke="#2D2D2D" stroke-width="1.5" />
      <polygon points="275,28 270,24 270,32" fill="#2D2D2D" />

      <!-- Stage 3: Multi-Model Training -->
      <rect x="280" y="0" width="115" height="55" rx="6" fill="#FFD66B" fill-opacity="0.3" stroke="#FFD66B" stroke-width="1.5" />
      <text x="12" y="24" font-family="'Epilogue', sans-serif" font-size="10.5" font-weight="700" fill="#2D2D2D">3. Training</text>
      <text x="12" y="42" font-family="'Epilogue', sans-serif" font-size="9" fill="#2D2D2D">Tree, SVM, Logistic</text>

      <!-- Arrow 3 -->
      <line x1="400" y1="28" x2="415" y2="28" stroke="#2D2D2D" stroke-width="1.5" />
      <polygon points="415,28 410,24 410,32" fill="#2D2D2D" />

      <!-- Stage 4: Evaluation -->
      <rect x="420" y="0" width="90" height="55" rx="6" fill="#009379" />
      <text x="12" y="24" font-family="'Epilogue', sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">4. Evaluate</text>
      <text x="12" y="42" font-family="'Epilogue', sans-serif" font-size="9" fill="#FFFFFF">F1, ROC, AUC</text>
    </g>

    <!-- Bottom Left: Model Comparison Bar Chart -->
    <g transform="translate(45, 170)">
      <rect x="0" y="0" width="290" height="180" rx="8" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1" />
      <text x="18" y="24" font-family="'Epilogue', sans-serif" font-size="11" font-weight="700" fill="#2D2D2D">Model Performance Comparison</text>

      <!-- Bar 1: Random Forest / Ensemble -->
      <text x="18" y="58" font-family="'Epilogue', sans-serif" font-size="9.5" fill="#555555">Random Forest</text>
      <rect x="100" y="46" width="145" height="16" rx="3" fill="#009379" />
      <text x="252" y="58" font-family="'Epilogue', sans-serif" font-size="10" font-weight="700" fill="#009379">84.6%</text>

      <!-- Bar 2: Support Vector Machine -->
      <text x="18" y="90" font-family="'Epilogue', sans-serif" font-size="9.5" fill="#555555">SVM Classifier</text>
      <rect x="100" y="78" width="138" height="16" rx="3" fill="#FF6250" />
      <text x="245" y="90" font-family="'Epilogue', sans-serif" font-size="10" font-weight="700" fill="#FF6250">81.2%</text>

      <!-- Bar 3: Decision Tree -->
      <text x="18" y="122" font-family="'Epilogue', sans-serif" font-size="9.5" fill="#555555">Decision Tree</text>
      <rect x="100" y="110" width="130" height="16" rx="3" fill="#FFD66B" />
      <text x="238" y="122" font-family="'Epilogue', sans-serif" font-size="10" font-weight="700" fill="#666666">78.5%</text>

      <!-- Bar 4: K-Nearest Neighbors -->
      <text x="18" y="154" font-family="'Epilogue', sans-serif" font-size="9.5" fill="#555555">KNN</text>
      <rect x="100" y="142" width="122" height="16" rx="3" fill="#2D2D2D" />
      <text x="230" y="154" font-family="'Epilogue', sans-serif" font-size="10" font-weight="700" fill="#2D2D2D">76.0%</text>
    </g>

    <!-- Bottom Right: Evaluation Metrics Badge -->
    <g transform="translate(355, 170)">
      <rect x="0" y="0" width="200" height="180" rx="8" fill="#2D2D2D" />
      <text x="18" y="28" font-family="'Epilogue', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Prediction Metrics</text>

      <rect x="18" y="46" width="164" height="34" rx="4" fill="#3D3D3D" />
      <text x="28" y="62" font-family="'Epilogue', sans-serif" font-size="9" fill="#BBBBBB">Cross-Validation Score</text>
      <text x="28" y="75" font-family="'Epilogue', sans-serif" font-size="10.5" font-weight="700" fill="#009379">5-Fold CV: 0.838</text>

      <rect x="18" y="88" width="164" height="34" rx="4" fill="#3D3D3D" />
      <text x="28" y="104" font-family="'Epilogue', sans-serif" font-size="9" fill="#BBBBBB">Key Features</text>
      <text x="28" y="117" font-family="'Epilogue', sans-serif" font-size="10" font-weight="600" fill="#FFD66B">Credit_History, Income</text>

      <rect x="18" y="130" width="164" height="34" rx="4" fill="#3D3D3D" />
      <text x="28" y="146" font-family="'Epilogue', sans-serif" font-size="9" fill="#BBBBBB">Pipeline Optimization</text>
      <text x="28" y="159" font-family="'Epilogue', sans-serif" font-size="10" font-weight="600" fill="#FF6250">StandardScaler + SMOTE</text>
    </g>
  </g>
</svg>
